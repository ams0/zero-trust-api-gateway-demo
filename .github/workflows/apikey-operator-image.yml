name: apikey-operator image

# Build the operator image in CI and publish it (multi-arch) to Docker Hub.
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (an access token).
on:
  push:
    branches: ["**"]
    paths:
      - "apikey-operator/**"
      - ".github/workflows/apikey-operator-image.yml"
    tags: ["apikey-operator/v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/apikey-operator
          tags: |
            type=raw,value=demo
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: apikey-operator
          file: apikey-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
