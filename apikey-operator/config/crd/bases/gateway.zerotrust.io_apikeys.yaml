---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: apikeys.gateway.zerotrust.io
spec:
  group: gateway.zerotrust.io
  names:
    kind: APIKey
    listKind: APIKeyList
    plural: apikeys
    shortNames:
    - ak
    singular: apikey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.secretName
      name: Secret
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          APIKey is an opaque, tier-scoped, optionally time-limited API key issued for the
          gateway. The controller mints a key value into a Secret and registers its bcrypt
          hash with the gateway's per-tier Traefik apiKey middleware.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: APIKeySpec defines the desired state of an APIKey.
            properties:
              description:
                description: Description is free-form human context for the key.
                type: string
              expiresAt:
                description: |-
                  ExpiresAt is an optional RFC3339 time after which the key is rejected.
                  Omit for a non-expiring key.
                format: date-time
                type: string
              owner:
                description: |-
                  Owner is free-form, self-asserted metadata identifying the consumer
                  (team, app, agent). NOT a security control — see docs/api-key-identity-provenance.md.
                type: string
              revoked:
                default: false
                description: |-
                  Revoked, when true, immediately invalidates the key at the gateway while
                  keeping the APIKey object and its Secret for audit.
                type: boolean
              tier:
                description: 'Tier the key is scoped to: free, pro, enterprise, or
                  "*" for all tiers.'
                enum:
                - free
                - pro
                - enterprise
                - '*'
                type: string
            required:
            - tier
            type: object
          status:
            description: APIKeyStatus defines the observed state of an APIKey.
            properties:
              conditions:
                description: Conditions represent the latest observations of the key's
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: ExpiresAt mirrors spec.expiresAt for at-a-glance visibility.
                format: date-time
                type: string
              issuedAt:
                description: IssuedAt is when the key value was first generated.
                format: date-time
                type: string
              keyPrefix:
                description: |-
                  KeyPrefix is the first few characters of the generated key, for identification.
                  The full key is only ever written to the Secret, never to status.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
              phase:
                description: 'Phase is the lifecycle phase: Pending, Active, Expired,
                  or Revoked.'
                type: string
              secretName:
                description: SecretName is the Secret (in the APIKey's namespace)
                  holding the key value.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
