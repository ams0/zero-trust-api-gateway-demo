apiVersion: v1
kind: Namespace
metadata:
  name: apikey-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apikey-operator-controller-manager
  namespace: apikey-operator-system
  labels:
    app.kubernetes.io/name: apikey-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apikey-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apikey-operator
    spec:
      serviceAccountName: apikey-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: apikey-operator:demo
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=false
            - --health-probe-bind-address=:8081
          env:
            # Namespace holding the per-tier aggregation Secrets + apiKey Middlewares
            # (must match where the Traefik routes live).
            - name: GATEWAY_NAMESPACE
              value: apps
          ports:
            - { name: health, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 128Mi }
