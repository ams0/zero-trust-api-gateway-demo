# Two OpenTelemetry-instrumented backends that produce a real distributed trace:
#   gateway -> orders -> inventory
# Both export OTLP traces to the LGTM collector. "orders" calls "inventory",
# so a single request through the gateway yields a multi-span, multi-service
# trace in Tempo (unlike whoami, which emits no spans of its own).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: apps
  labels: { app: orders }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      containers:
        - name: orders
          image: echo-svc:demo
          imagePullPolicy: IfNotPresent
          env:
            - { name: OTEL_SERVICE_NAME, value: "orders" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "lgtm.observability.svc.cluster.local:4317" }
            - { name: DOWNSTREAM_URL, value: "http://inventory.apps.svc.cluster.local/" }
            - { name: LISTEN_ADDR, value: ":8080" }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: apps
spec:
  selector: { app: orders }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: apps
  labels: { app: inventory }
spec:
  replicas: 1
  selector:
    matchLabels: { app: inventory }
  template:
    metadata:
      labels: { app: inventory }
    spec:
      containers:
        - name: inventory
          image: echo-svc:demo
          imagePullPolicy: IfNotPresent
          env:
            - { name: OTEL_SERVICE_NAME, value: "inventory" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "lgtm.observability.svc.cluster.local:4317" }
            - { name: LISTEN_ADDR, value: ":8080" }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: apps
spec:
  selector: { app: inventory }
  ports: [{ port: 80, targetPort: 8080 }]
