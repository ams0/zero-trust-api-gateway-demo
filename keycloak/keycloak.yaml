# Keycloak as the identity provider that issues the JWTs Traefik validates.
# Runs in dev mode and imports the "demo" realm on startup. The realm JSON is
# mounted from a ConfigMap (generated by the install script with --from-file).
#
# Keycloak is reachable two ways:
#   * in-cluster  http://keycloak.keycloak.svc.cluster.local:8080  (Traefik fetches JWKS here)
#   * externally  https://keycloak.local                          (clients fetch tokens here)
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          env:
            # Keycloak 26 bootstrap admin (older images use KEYCLOAK_ADMIN/_PASSWORD)
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: "admin" }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: "admin" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            # Sit behind Traefik's TLS termination without hostname grief.
            - { name: KC_PROXY_HEADERS, value: "xforwarded" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /realms/demo, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
