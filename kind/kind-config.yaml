# kind cluster for the Zero-Trust API Gateway demo.
# control-plane node publishes 80/443 to the host so Traefik's NodePort
# service is reachable at https://*.local on the laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: zero-trust-gw
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # host 80  -> Traefik web entrypoint        (NodePort 30080)
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      # host 443 -> Traefik websecure entrypoint   (NodePort 30443)
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
